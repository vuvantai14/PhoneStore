name: PhoneStore CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test-windows:
    name: Build Solution & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore PhoneStore.sln

      - name: Build solution
        run: dotnet build PhoneStore.sln --no-restore --configuration Release

      - name: Build supplemental projects
        run: |
          dotnet build tools/PhoneStore.CatalogImport/PhoneStore.CatalogImport.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tools/PhoneStore.AcceptanceEnvironment/PhoneStore.AcceptanceEnvironment.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/PhoneStore.SqlIntegration/PhoneStore.SqlIntegration.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run unit & isolated tests
        run: dotnet test tests/PhoneStore.Tests/PhoneStore.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Publish and check Admin WinForms artifact
        shell: pwsh
        run: ./scripts/ci/Publish-AdminArtifact.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'phonestore-admin')

      - name: Upload Admin WinForms
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PhoneStore.Admin-net10-win-x64-${{ github.sha }}-run${{ github.run_id }}.${{ github.run_attempt }}
          path: ${{ runner.temp }}/phonestore-admin/
          if-no-files-found: error
          retention-days: 14

  build-docker-ubuntu:
    name: Build Docker Image (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Prepare image inputs without runtime configuration
        run: python3 scripts/ci/prepare_image_context.py "$RUNNER_TEMP/image-context"

      - name: Build PhoneStore.Web Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/image-context
          file: ${{ runner.temp }}/image-context/Dockerfile
          platforms: linux/amd64
          push: false
          tags: phonestore-web:ci

      - name: Build PhoneStore.Api Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/image-context
          file: ${{ runner.temp }}/image-context/src/PhoneStore.Api/Dockerfile
          platforms: linux/amd64
          push: false
          tags: phonestore-api:ci

      - name: Validate merged business Compose configuration
        run: python3 scripts/ci/validate_business_compose.py

  publish-ghcr:
    name: Publish Web and API to GHCR
    needs: [build-and-test-windows, build-docker-ubuntu]
    if: success() && github.repository == 'vuvantai14/PhoneStore' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      WEB_IMAGE: ghcr.io/vuvantai14/phonestore-web
      API_IMAGE: ghcr.io/vuvantai14/phonestore-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare image inputs without runtime configuration
        run: python3 scripts/ci/prepare_image_context.py "$RUNNER_TEMP/image-context"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Web
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/image-context
          file: ${{ runner.temp }}/image-context/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish API
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/image-context
          file: ${{ runner.temp }}/image-context/src/PhoneStore.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.API_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify registry references and record release manifest
        env:
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
        shell: python
        run: |
          import json, os, re, subprocess
          from pathlib import Path
          env = os.environ
          sha = env["GITHUB_SHA"]
          tag = f"sha-{sha}"
          images = {}
          for service in ("web", "api"):
              name = env[f"{service.upper()}_IMAGE"]
              digest = env[f"{service.upper()}_DIGEST"]
              if not re.fullmatch(r"sha256:[a-f0-9]{64}", digest):
                  raise SystemExit(f"Missing or invalid Buildx digest for {service}")
              reference = f"{name}@{digest}"
              descriptor = subprocess.check_output(["docker", "buildx", "imagetools", "inspect",
                                                    f"{name}:{tag}", "--format", "{{json .Manifest}}"])
              if json.loads(descriptor)["digest"] != digest:
                  raise SystemExit(f"Registry tag digest differs from Buildx output for {service}")
              images[service] = {"tag": f"{name}:{tag}", "digest": digest, "reference": reference}
          manifest = {"repository": env["GITHUB_REPOSITORY"], "commit_sha": sha,
                      "run_id": env["GITHUB_RUN_ID"], "run_attempt": env["GITHUB_RUN_ATTEMPT"],
                      "images": images}
          Path(env["RUNNER_TEMP"], "images.json").write_text(json.dumps(manifest, indent=2) + "\n")
      - name: Upload release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phonestore-images-${{ github.sha }}-run${{ github.run_id }}.${{ github.run_attempt }}
          path: ${{ runner.temp }}/images.json
          if-no-files-found: error
          retention-days: 30
