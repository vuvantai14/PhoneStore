name: phonestore-acceptance-s323b
services:
  api:
    image: sha256:9b20d979aa6af3ff2866f2611d05cd404d1d8b600f66f3165804c812f565f894
    mem_limit: 256m
    cpus: 0.5
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: '8080'
      ConnectionStrings__PhoneStoreConnection: '${S323B_CONNECTION:?Run Compose.ps1}'
    ports:
      - '127.0.0.1:5286:8080'
    healthcheck:
      test: ['CMD-SHELL', 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /api/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; read -r status <&3; [[ "$${status}" == *" 200 "* ]]''']
      interval: 15s
      timeout: 5s
      retries: 3
  web:
    # Update this pin only after accepting a replacement Web image.
    image: sha256:aeddfa741bc08488a4ead664f73033ac42f9a2287633cb9b99d89ac5fd655d42
    mem_limit: 384m
    cpus: 0.5
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: '8080'
      ConnectionStrings__PhoneStoreConnection: '${S323B_CONNECTION:?Run Compose.ps1}'
      CatalogApi__Enabled: 'true'
      CatalogApi__BaseUrl: 'http://api:8080/'
      CatalogApi__TimeoutSeconds: '3'
    ports:
      - '127.0.0.1:5285:8080'
    volumes:
      - type: bind
        source: '${S323B_UPLOADS:?Run Compose.ps1}'
        target: /app/wwwroot/uploads/products
        read_only: true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET / HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; read -r status <&3; [[ "$${status}" == *" 200 "* ]]''']
      interval: 15s
      timeout: 5s
      retries: 3
