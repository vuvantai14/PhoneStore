name: "${COMPOSE_PROJECT_NAME:-phonestore-acceptance}"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the ignored .env file}"
      MSSQL_PID: "Developer"
    ports:
      - "127.0.0.1:${SQL_PORT:-14334}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q 'SELECT 1'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - phonestore-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__PhoneStoreConnection: "Server=db,1433;Database=${DB_NAME:-PhoneStoreDockerDB};User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the ignored .env file};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=true;"
      CatalogApi__Enabled: "${CATALOG_API_ENABLED:-true}"
      CatalogApi__BaseUrl: "http://api:8080/"
      CatalogApi__TimeoutSeconds: "${CATALOG_API_TIMEOUT_SECONDS:-3}"
    ports:
      - "127.0.0.1:${WEB_PORT:-5015}:8080"
    volumes:
      - type: bind
        source: "${PRODUCT_UPLOADS_PATH:?Set PRODUCT_UPLOADS_PATH to the host product-images directory}"
        target: /app/wwwroot/uploads/products
        read_only: true
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET / HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; read -r status <&3; [[ "$${status}" == *" 200 "* ]]'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - phonestore-net

  api:
    build:
      context: .
      dockerfile: src/PhoneStore.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__PhoneStoreConnection: "Server=db,1433;Database=${DB_NAME:-PhoneStoreDockerDB};User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the ignored .env file};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=true;"
    ports:
      - "127.0.0.1:${API_PORT:-5025}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /api/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; read -r status <&3; [[ "$${status}" == *" 200 "* ]]'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - phonestore-net

volumes:
  mssql_data:

networks:
  phonestore-net:
    driver: bridge
